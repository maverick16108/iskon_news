# news.prema.su — фронтенд статикой, API проксируется в uvicorn.
# Класть в /etc/nginx/sites-available/news.prema.su и линковать в sites-enabled.
# Блок с TLS дописывает certbot: certbot --nginx -d news.prema.su

server {
    listen 80;
    listen [::]:80;
    server_name news.prema.su;

    root /var/www/news.prema.su;
    index index.html;

    access_log /var/log/nginx/news.prema.su.access.log;
    error_log  /var/log/nginx/news.prema.su.error.log;

    client_max_body_size 4m;

    # Сборка Vite: файлы с хешем в имени можно кэшировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Переработка статьи через OpenAI занимает десятки секунд
        proxy_connect_timeout 15s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # SPA: любой неизвестный путь отдаём index.html, маршрутизацию делает Vue Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
