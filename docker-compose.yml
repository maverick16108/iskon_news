services:
  db:
    image: postgres:16-alpine
    container_name: iskcon_news_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: iskcon
      POSTGRES_PASSWORD: iskcon
      POSTGRES_DB: iskcon_news
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iskcon -d iskcon_news"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
